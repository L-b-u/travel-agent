[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "基于 LangGraph 的多 Agent 协作旅行规划系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Travel Agent Author" }]
keywords = ["ai", "agent", "langgraph", "travel", "fastapi"]
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn>=0.34.0",
    "langchain==1.2.15",
    "langchain-core==1.3.1",
    "langchain-openai==1.2.0",
    "langgraph==1.1.9",
    "openai>=1.60.0",
    "pydantic==2.13.3",
    "pydantic-settings>=2.7.0",
    "python-dotenv==1.2.2",
    "httpx>=0.28.0",
    "loguru>=0.7.0",
    # RAG：中文分词 + BM25 检索（纯 Python，无重型依赖）
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
observability = [
    "langfuse>=2.59.0",
]
frontend = [
    "streamlit>=1.40.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]